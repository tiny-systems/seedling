# The tiny loop, all event-driven, no stored credentials:
#   issue labeled `tiny`  -> courier job (seconds) delivers it to the root
#                            session's inbox in the cluster
#   root session works    -> pushes tiny/issue-N (code) or tiny/reply-N
#                            (textual answer) using the deploy key
#   push arrives          -> these jobs (seconds, GitHub's own token) turn
#                            the push into a PR / an issue comment
name: tiny
on:
  issues:
    types: [labeled]
  push:
    branches: ["tiny/issue-*", "tiny/reply-*"]
  schedule:
    - cron: "*/5 * * * *"   # the outbox courier
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  deliver:
    if: github.event_name == 'issues' && github.event.label.name == 'tiny'
    runs-on: [self-hosted, tiny]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      N: ${{ github.event.issue.number }}
      # Issue title/body are ATTACKER-CONTROLLED: they enter only as env
      # vars, never interpolated into this script.
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: deliver the issue to the root session
        run: |
          {
            printf 'GitHub issue #%s of %s: %s\n\n' "$N" "$GITHUB_REPOSITORY" "$ISSUE_TITLE"
            printf '%s\n\n' "$ISSUE_BODY"
            echo "Handle it end to end. Conventions — you have NO git credentials; the outbox pushes for you:"
            echo "- Code: commit on branch tiny/issue-$N, then: mkdir -p /workspace/outbox && git bundle create /workspace/outbox/tiny-issue-$N.bundle tiny/issue-$N — it reaches GitHub within ~5 minutes and a PR opens automatically."
            echo "- Textual answer or blockers: commit REPLY.md on branch tiny/reply-$N and bundle that branch the same way — it becomes an issue comment."
            echo "- Never try to push or call the GitHub API yourself; the bundle IS the send. One bundle per branch; re-bundle to update."
            echo "- Spawn specialist sessions for other toolchains. Keep your title current. ask_human for real human decisions."
          } | tiny deliver root --ensure --repo "https://github.com/$GITHUB_REPOSITORY.git"
      - name: receipt
        # curl, not gh: the runner image carries no gh CLI
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$N/comments" \
            -d '{"body":"🌱 tiny picked this up — the root session is on it. Code arrives as a PR; answers as comments."}' >/dev/null

  export:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, tiny]
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: push pending outbox bundles
        run: |
          set -e
          rm -rf outbox && tiny export
          shopt -s nullglob
          for b in outbox/*.bundle; do
            f=$(basename "$b"); branch="${f#*__}"; branch="${branch%.bundle}"; branch="${branch/tiny-issue-/tiny/issue-}"; branch="${branch/tiny-reply-/tiny/reply-}"
            git init -q work && cd work
            git fetch -q "../$b" "$branch"
            git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "FETCH_HEAD:refs/heads/$branch"
            cd .. && rm -rf work
            echo "pushed $branch"
          done

  open-pr:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'tiny/issue-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: open or update the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          N="${BRANCH#tiny/issue-}"
          gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --title "tiny: $(gh issue view "$N" --repo "$GITHUB_REPOSITORY" --json title -q .title)" \
            --body "Closes #$N — opened automatically from the \`$BRANCH\` push."
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" \
            --body "🌱 pull request opened from \`$BRANCH\`."

  reply:
    if: github.event_name == 'push' && startsWith(github.ref_name, 'tiny/reply-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: post the reply and clean up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          N="${BRANCH#tiny/reply-}"
          gh issue comment "$N" --repo "$GITHUB_REPOSITORY" --body-file REPLY.md
          git push origin --delete "$BRANCH"
